name: Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # erlaubt manuelles Auslösen über den Actions-Tab

permissions:
  contents: read
  pages: write
  id-token: write

# Nur ein Deploy gleichzeitig
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Publish
        run: dotnet publish "Dartboard Randomizer/Dartboard Randomizer/Dartboard Randomizer.csproj" -c Release -o publish

      # App liegt unter /Dartboard-Randomizer/ -> base href anpassen
      - name: Fix base href
        run: sed -i 's|<base href="/" />|<base href="/Dartboard-Randomizer/" />|g' publish/wwwroot/index.html

      # Client-seitiges Routing: unbekannte Pfade (z.B. /game) auf die App zurückfallen lassen
      - name: SPA 404 fallback
        run: cp publish/wwwroot/index.html publish/wwwroot/404.html

      # Verhindert, dass GitHub Pages den _framework-Ordner ignoriert
      - name: Add .nojekyll
        run: touch publish/wwwroot/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: publish/wwwroot

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
